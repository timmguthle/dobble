<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="A simple browser version of Dobble using the provided symbols."
    />
    <title>Dobble</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="game-shell">
      <header class="game-header">
        <div>
          <p class="eyebrow">Spot the match</p>
          <h1>Dobble</h1>
        </div>
        <div class="score-panel" aria-live="polite">
          <span>Score</span>
          <strong id="score">0</strong>
        </div>
      </header>

      <section class="instructions" aria-labelledby="instructions-title">
        <h2 id="instructions-title">Find the one matching symbol</h2>
        <p id="status" role="status">
          There is exactly one symbol shared by both cards.
        </p>
      </section>

      <div class="mode-switch" role="group" aria-label="Game mode">
        <button class="mode-button is-active" id="training-mode" type="button">
          Training
        </button>
        <button class="mode-button" id="deck-mode" type="button">
          One deck
        </button>
      </div>

      <section class="cards" aria-label="Dobble cards">
        <div class="card" id="card-one" aria-label="First Dobble card"></div>
        <div class="versus" aria-hidden="true">VS</div>
        <div class="card" id="card-two" aria-label="Second Dobble card"></div>
      </section>

      <div class="controls">
        <button class="button button-secondary" id="new-game" type="button">
          New game
        </button>
        <button class="button button-secondary" id="pause-game" type="button">
          Pause game
        </button>
        <p class="round-counter" id="round-counter">Round 1</p>
      </div>

      <section class="statistics" id="statistics" hidden aria-labelledby="statistics-title">
        <div class="statistics-header">
          <div>
            <p class="eyebrow">Your results</p>
            <h2 id="statistics-title">Statistics</h2>
          </div>
          <button class="button button-light" id="resume-game" type="button">
            Resume game
          </button>
        </div>
        <div class="stat-grid">
          <div class="stat-card"><span>Average time</span><strong id="average-time">—</strong></div>
          <div class="stat-card"><span>Rounds played</span><strong id="rounds-played">0</strong></div>
          <div class="stat-card"><span>Fastest find</span><strong id="fastest-time">—</strong></div>
          <div class="stat-card"><span>Slowest find</span><strong id="slowest-time">—</strong></div>
        </div>
        <h3>Symbol statistics</h3>
        <ol class="symbol-ranking" id="symbol-ranking"></ol>
        <button class="button button-text" id="clear-statistics" type="button">
          Clear saved statistics
        </button>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
